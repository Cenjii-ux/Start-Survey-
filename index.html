<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>START SURVEY</title>

  <style>
    body {
      background-color: black;
      color: white;
      font-family: monospace;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
      overflow: hidden;
    }

    .container {
      text-align: center;
      max-width: 600px;
    }

    #text {
      font-size: 1.2em;
      white-space: pre-line;
    }

    .buttons {
      margin-top: 20px;
    }

    button {
      margin: 10px;
      padding: 10px 35px;
      background: black;
      color: white;
      border: 1px solid white;
      cursor: pointer;
      font-family: monospace;
    }

    button:hover {
      background: white;
      color: black;
    }

    #glitch {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      opacity: 0;
      background: repeating-linear-gradient(
        0deg,
        rgba(255,255,255,0.08),
        rgba(255,255,255,0.08) 1px,
        transparent 1px,
        transparent 3px
      );
    }

    input{
    background:black;
    color:white;
    border:1px solid white;
    padding:10px;
    width:220px;
    font-family:monospace;
}

input:focus{
    outline:none;
}
  </style>
</head>

<body>

<!-- LOGIN SCREEN -->
<div id="loginScreen" class="container">
    <h2>LOGIN REQUIRED</h2>

    <input type="text" id="username" placeholder="Username"><br><br>

    <input type="password" id="password" placeholder="Password"><br><br>

    <button onclick="login()">LOGIN</button>

    <p id="loginMessage" style="color:red;"></p>
</div>

<!-- SURVEY -->
<div id="surveyScreen" style="display:none;">

    <div id="glitch"></div>

    <img id="jumpscare" src="nics.jfif"
    style="
    position:fixed;
    top:0;
    left:0;
    width:100%;
    height:100%;
    display:none;
    z-index:9999;
    object-fit:cover;
    ">

    <audio id="scareSound" src="the-weeknd-rizz.mp3"></audio>

    <div class="container">
        <p id="text">START SURVEY?</p>

        <div class="buttons">
            <button onclick="answer('yes')">YES</button>
            <button onclick="answer('no')">NO</button>
        </div>
    </div>

</div>



  <script>

    function triggerJumpscare() {

  const img = document.getElementById("jumpscare");
  const sound = document.getElementById("scareSound");

  img.style.display = "block";
  sound.play();

  // optional: hide after 2 seconds
  setTimeout(() => {
    img.style.display = "none";
  }, 2000);

}

    let startTime = Date.now();
    let questionIndex = 0;
    let finalIndex = 0;
    let typingInterval;
    let noCounter = 0; // tracks consecutive No clicks

    const questions = [
      "START SURVEY?",
      "Are you alone right now?",
      "Do you believe this survey is harmless?",
      "Do you feel watched when using a screen?",
      "If you stopped now, would it bother you?",
      "Do you trust what is asking these questions?",
      "Would you like to continue?",
      "Are you completely sure you are real right now?",
      "Do you believe your thoughts belong only to you?",
      "Have you ever questioned whether this moment has happened before?",
      "If your memories were altered, would you notice?",
      "Do you trust your mind to tell you the truth?",
      "Have you answered honestly so far?",
      "Are you certain you chose to be who you are today?",
      "Do you think reality exists when you’re not observing it?",
      "Have you ever felt like you were watching yourself from inside?",
      "Would you recognize yourself without your memories?",
      "Do you believe you have full control over your decisions?",
      "If you disappeared, would the world feel different?",
      "Are you sure your awareness ends when you sleep?",
      "Do you believe time is moving forward right now?",
      "Have you ever felt like something was subtly 'off' about the world?",
      "Would you know if you were being guided toward certain choices?",
      "Are you confident that this is your first time answering these questions?",
      "Do you believe your identity is permanent?",
      "If reality depended on you, would you feel it?",
      "Do you trust your senses completely?",
      "After answering these questions, do you feel exactly the same as before?"
    ];

    const finalQuestions = [
      "Before this survey, did you feel real?",
      "What makes you certain you exist?",
      "If no one observes you, do your choices matter?",
      "Are your thoughts truly yours?",
      "Or are they responses to something unseen?",
      "This survey did not change you.",
      "It only revealed you.",
      "Your answers were expected.",
      "You were honest.",
      "You may close this now.",
      "The survey is complete.",
      "The system will not stop thinking about you."
    ];

    // Alternate questions for repeated No clicks
    const noQuestions = [
      "You hesitated. Why?",
      "Do you really want to refuse?",
      "Are you afraid of what this survey might reveal?",
      "Even if you say no, it will observe.",
      "Do you want to reconsider?"
    ];

    function glitchEffect() {
      const glitch = document.getElementById("glitch");
      glitch.style.opacity = 0.25;
      setTimeout(() => glitch.style.opacity = 0, 120);
    }

    document.body.style.backgroundColor = "white";
setTimeout(()=>{
 document.body.style.backgroundColor = "black";
},100);

    function typeText(text) {
      const display = document.getElementById("text");
      display.textContent = "";
      let i = 0;

      clearInterval(typingInterval);

      typingInterval = setInterval(() => {
        display.textContent += text.charAt(i);
        i++;

        if (i >= text.length) {
          clearInterval(typingInterval);
        }
      }, 35);
    }

    function answer(choice) {
      // example: jumpscare on question 3 if No is clicked
if(choice === "no" && questionIndex === 16){
    triggerJumpscare();
}
setTimeout(nextQuestion, 1000);

      const now = Date.now();
      const hesitation = ((now - startTime) / 1000).toFixed(1);

      let history = JSON.parse(localStorage.getItem("observerChoices")) || [];

      history.push({
        question: questions[questionIndex],
        answer: choice,
        hesitation: hesitation
      });

      localStorage.setItem("observerChoices", JSON.stringify(history));

      // Handle No clicks
      if (choice === 'no') {
        noCounter++;

        if (noCounter >= 2) {
          // Show a random No question
          const altQuestion = noQuestions[Math.floor(Math.random() * noQuestions.length)];
          typeText(altQuestion);

          noCounter = 0; // reset counter
          return; // stop going to next normal question
        }
      } else {
        noCounter = 0; // reset if user says Yes
      }

      setTimeout(nextQuestion, 1000);
    }

    function nextQuestion() {
      questionIndex++;
      startTime = Date.now();

      if (questionIndex < questions.length) {
        if (Math.random() < 0.3) glitchEffect();
        typeText(questions[questionIndex]);
      } else {
        endSurvey();
      }
    }

    function endSurvey() {
      document.querySelector(".buttons").style.display = "none";
      finalIndex = 0;
      showFinalQuestion();
    }

    function showFinalQuestion() {
      if (finalIndex < finalQuestions.length) {
        if (Math.random() < 0.4) glitchEffect();
        typeText(finalQuestions[finalIndex]);
        finalIndex++;
        setTimeout(showFinalQuestion, 2600);
      }
    }

    // Start survey

    // LOGIN

const USERNAME = "observer";
const PASSWORD = "0427";

function login(){

    const user = document.getElementById("username").value;
    const pass = document.getElementById("password").value;

    if(user === USERNAME && pass === PASSWORD){

        document.getElementById("loginScreen").style.display = "none";
        document.getElementById("surveyScreen").style.display = "block";

        typeText(questions[0]);

    }else{

        document.getElementById("loginMessage").textContent =
        "ACCESS DENIED";

    }

}
    typeText(questions[0]);
  </script>

</body>
</html>
